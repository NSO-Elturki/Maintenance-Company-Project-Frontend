<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h3 class="card-title mb-0">{{tableTitle}}</h3>
                    <button class="btn btn-light btn-sm" [routerLink]="[createPath]">+ Add New {{ tableTitle }}</button>
                </div>
                <div class="card-body">
                    <div *ngIf="data.length > 0; else noJobs">
                        <table class="table table-striped table-bordered">
                            <thead class="table-primary">
                                <tr>
                                    <th *ngFor="let column of columns" class="text-center">{{ column }}</th>
                                    <th>actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let item of data">
                                    <td *ngFor="let column of columns" class="text-center">
                                        {{ item[column]?.name || item[column] }}

                                    </td>
                                    <td class="text-center">
                                        <button class="btn btn-sm btn-warning me-2"
                                            (click)="onView(item.id)">View</button>
                                        <button class="btn btn-sm btn-danger"
                                            (click)="onDelete(item.id)">Delete</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <ng-template #noJobs>
                        <p class="text-center text-muted">No {{tableTitle}} found. Start by creating a new one.</p>
                    </ng-template>
                </div>
