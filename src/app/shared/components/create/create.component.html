<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title mb-0">Create {{title}}</h3>
                </div>
                <div class="card-body">
                    <form (ngSubmit)="onSubmit()">
                        <!-- Iterate over fields to display form inputs -->
                        <div *ngFor="let field of fields" class="form-group mt-3">
                            <label>{{field.label}}</label>

                            <!-- Text or number input fields -->
                            <input *ngIf="field.type !== 'select'" 
                                [type]="field.type"
                                [(ngModel)]="formData[field.name]" 
                                name="{{ field.name }}" 
                                class="form-control" />

                            <!-- Select input field -->
                            <div *ngIf="field.type === 'select'">
                                <label for="{{field.name}}"></label>
                                <select class="form-control" 
                                    id="{{field.name}}" 
                                    [(ngModel)]="formData[field.name]" 
                                    name="{{field.name}}">
                                    <option value="" disabled>Select a Job</option>
                                    <option *ngFor="let job of list" [ngValue]="job">
                                        {{ job.name }}
                                    </option>
                                </select>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="mt-3 d-flex justify-content-end">
                            <button class="btn btn-primary" type="submit">Create</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
